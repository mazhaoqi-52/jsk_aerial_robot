aerial_robot_control_name: aerial_robot_control/beetle_controller

controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : true
  i_term_rp_calc_in_pc: true
  wrench_estimate_update_rate: 100
  momentum_observer_force_weight: 3
  momentum_observer_torque_weight: 2.5
  wrench_estimate_flag: true
  # wrench_estimate_flag: false
  comp_term_update_freq: 40
  unified_control_mode: false
  z_i_seed_default: 0.8    # Z I-term seed fallback (used when N not in z_i_seed_by_n)
  pitch_i_seed_default: -0.55  # Pitch I-term seed fallback (err_i domain)

  # P2: Per-module-count seed bucketing.
  z_i_seed_by_n:
    n2: 0.9
    n3: 0.8
  pitch_i_seed_by_n:
    n2: -0.20
    n3: -0.55
  z_ki_boost_frames_default: 60
  z_ki_boost_factor_default: 2.0
  z_ki_boost_by_n:
    n2:
      frames: 60
      factor: 2.0
    n3:
      frames: 60
      factor: 2.0

  # ========== Formation Momentum Observer (Phase U2) ==========
  # Formation-level external wrench estimation using realized wrench from allocation.
  # V1: 3D force only, debug-only output (no control feedback).
  formation_observer:
    force_observer_gain: 3.0
    torque_observer_gain: 2.5
    enable_force_observer: true
    enable_torque_observer: true
    est_force_lpf_cutoff_freq: 1.0   # Hz: output LPF on force estimate
    est_torque_lpf_cutoff_freq: 2.0  # Hz: output LPF on torque estimate
    bias_settle_time: 3.0
    bias_calib_samples: 200  # effective only in this namespace; sampling is gated until unified-hover

  # ========== UO-4: Formation observer feedforward compensation ==========
  # Enable ONLY after E2 validation (known-mass test confirms correct Z estimation).
  # Sign: if observer detects downward load (f_body_z < 0), FF adds upward thrust.
  # z_gain: scale factor [0,1]; start with 0.3–0.5 to be conservative.
  formation_observer_comp:
    enable: true
    z_gain: 0.5      # Z feedforward gain [0,1]; validated with E2
    xy_gain: 0.3      # X/Y feedforward gain [0,1]; start conservative (horizontal less reliable)
    torque_gain: 0.5  # Roll/Pitch/Yaw torque feedforward gain [0,1]; start conservative

  # ========== Cascade control for unified mode ==========
  # Torque-level gains sent to spinal via RollPitchYawTerms.
  # Spinal does P+D at 1000Hz; PC retains I-term only.
  cascade_roll_p: 8.0
  cascade_roll_d: 5.0
  cascade_pitch_p: 8.0
  cascade_pitch_d: 5.0
  cascade_yaw_d: 2.5
  yaw_in_allocation: false  # false: single-channel yaw (spinal-only), true: include yaw in QP
  tgt_angle_lpf_alpha: 0.3

  # Full-vector constrained QP allocation
  # Decision variables: all force components [f_x, f_z] per rotor (not just scalar thrust).
  # Constraints: gimbal angle limits (linearized), component bounds, optional rate limits.
  use_constrained_alloc: true
  alloc_lambda: 1.0e-4          # regularization weight (larger → softer, smaller → tighter tracking)
  alloc_t_max: 21.0             # per-rotor thrust upper bound [N]
  alloc_gimbal_limit_deg: 75.0  # gimbal angle hard limit [deg] (< 90° to avoid singularity)
  alloc_rate_limit: 5.0         # max force change per step [N/step], 0 = disabled

  pd_wrench_comp_mode: true
  # pd_wrench_comp_mode: false

  external_force_upper_limit: 0.0
  external_force_lower_limit: 0.0
  external_torque_lower_limit: 0.0
  external_torque_lower_limit: 0.0

  cutoff_freq: 1.0
  sample_freq: 40.0

  wrench_comp:
    p_gain: 0.1
    d_gain: 0.07
    i_gain: 0.0
  xy:
    p_gain: 10.0
    i_gain: 0.2
    d_gain: 4.0       # F-6: 5.0→4.0  XY D-term noise is the largest contributor to bt0
    err_d_lpf_cutoff_freq: 3.5  # F-6: NEW  3.5Hz LPF on XY velocity error
    limit_sum: 8.0
    limit_p: 12.0
    limit_i: 5.0
    limit_d: 12.0

  z:
    p_gain: 8.0
    i_gain: 1.5
    d_gain: 4.0       # F-5a: 5.0→4.0  Z D-term dominates bt0 oscillation (100% of pid_body_z variance)
    err_d_lpf_cutoff_freq: 3.0  # F-5b: NEW  3Hz LPF on Z velocity error to reject sensor noise
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 20.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  roll:
    p_gain: 17.0 #8~25
    i_gain: 5.0
    d_gain: 15.0 #4~11
    limit_sum: 0.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0

    start_rp_integration_height: 0.01

  pitch:
    p_gain: 17.0 #8~25
    i_gain: 5.0
    d_gain: 12.0 #4~11
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0

    start_rp_integration_height: 0.01

  yaw:
    p_gain: 15.0
    i_gain: 1.0
    d_gain: 10.0
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 5.0
    limit_d: 20.0

    need_d_control: true

  # Unified-mode PID gains for roll/pitch.
  # Applied ONLY when entering unified control mode; restored on exit.
  # Roll/Pitch: only i_gain is used on PC (P+D handled by spinal cascade).
  unified_roll:
    i_gain: 1.0
    limit_sum: 50.0
    limit_i: 10.0

  unified_pitch:
    i_gain: 3.0
    limit_sum: 50.0
    limit_i: 20.0

  unified_xy:
    p_gain: 10.0
    i_gain: 0.15
    d_gain: 3        # ζ = 5.5/(2×√10) = 0.870 (was 4.0, ζ=0.632 underdamped)
    err_d_lpf_cutoff_freq: 3.5  # 3.5→1.5 Hz: suppress D-term noise at low-freq oscillation (0.15-0.2Hz)
    limit_sum: 8.0
    limit_p: 12.0
    limit_i: 5.0
    limit_d: 12.0

  unified_z:
    p_gain: 8.0
    i_gain: 1.5
    d_gain: 4.0
    limit_sum: 25.0
    limit_p: 25.0
    limit_i: 20.0
    limit_d: 25.0

  # Unified-mode yaw PID gains.
  # Full P+I+D used on PC side; spinal adds D-only damping via cascade_yaw_d.
  # When yaw_in_allocation=true, yaw PID output participates in 6-DOF QP allocation
  # (same as GimbalRotor standard mode). Otherwise single-channel spinal broadcast.
  unified_yaw:
    p_gain: 15.0
    i_gain: 1.0
    d_gain: 10.0
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 5.0
    limit_d: 20.0
