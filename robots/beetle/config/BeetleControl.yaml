aerial_robot_control_name: aerial_robot_control/beetle_controller

controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : true
  i_term_rp_calc_in_pc: true
  wrench_estimate_update_rate: 100
  momentum_observer_force_weight: 3
  momentum_observer_torque_weight: 2.5
  wrench_estimate_flag: true
  # wrench_estimate_flag: false
  comp_term_update_freq: 40
  unified_control_mode: false
  unified_reference_warmup_frames: 20  # leader-side local warmup after mode switch [frames @40Hz]

  # Differential-mode damping gain (passive internal-force dissipation).
  # Each module injects -K * inter_wrench/mass (force) and -K * I_inv * inter_wrench (torque)
  # into its local target_wrench_acc, where inter_wrench = est_wrench_module - mean_over_modules.
  # Dissipates disagreement between per-module momentum observers (non-rigid interface,
  # mounting error, IMU/estimator drift, vibration).
  # 0.0 = DISABLED (real-hardware default — enable only after bag-analyzing
  # /beetleX/internal_wrench spectrum and confirming no resonance near inner-loop BW).
  # Recommended tuning path on hardware: 0.0 -> 0.02 -> 0.05 (tether/ground first).
  unified_diff_damp_gain: 0.05

  # FormationObserver bias-calibration PID-settled gate.
  # Bias is only calibrated when the summed |d(R/P/Y I-term)/dt| over one frame
  # stays below this threshold for N consecutive frames while HOVER is active.
  # Goal: prevent the observer from "calibrating away" a real cog model error
  # while the integrators are still compensating for it.
  # Rule of thumb: if you see pitch_i drifting > 0.05 Nm/frame, raise threshold
  # (or lower frames) to eventually admit; if you want stricter (avoid false
  # positives on noisy hover), lower threshold to ~0.02.
  bias_pid_settled_rate_thresh: 0.05   # [Nm/frame], summed over roll+pitch+yaw I-terms
  bias_pid_settled_frames:      40     # ~1 s @ 40 Hz
  z_i_seed_default: 0.8    # Z I-term seed fallback (used when N not in z_i_seed_by_n)
  pitch_i_seed_default: -0.55  # Pitch I-term seed fallback (err_i domain)

  # P2: Per-module-count seed bucketing.
  z_i_seed_by_n:
    n2: 0.9
    n3: 0.8
  pitch_i_seed_by_n:
    n2: -0.20
    n3: -0.55
  z_ki_boost_frames_default: 60
  z_ki_boost_factor_default: 2.0
  z_ki_boost_by_n:
    n2:
      frames: 60
      factor: 2.0
    n3:
      frames: 60
      factor: 2.0

  # ========== Formation Momentum Observer (Phase U2) ==========
  # Formation-level external wrench estimation using realized wrench from allocation.
  # V1: 3D force only, debug-only output (no control feedback).
  formation_observer:
    force_observer_gain: 3.0
    torque_observer_gain: 2.5
    enable_force_observer: true
    enable_torque_observer: true
    # Stage-1 LPF cutoff. Pushed to 0.05 Hz so that any sub-Hz hover oscillation
    # (e.g. ~0.2 Hz) is attenuated by ≥75 % before reaching the FF path.
    est_force_lpf_cutoff_freq: 0.05
    est_torque_lpf_cutoff_freq: 0.05
    bias_settle_time: 3.0
    bias_calib_samples: 200  # effective only in this namespace; sampling is gated until unified-hover
    # Stage-2 ramp: after bias completes, FF rises 0→1 over this many seconds.
    ff_ramp_seconds: 5.0

  # ========== Formation observer feedforward (redesigned, leader-follower style) ==========
  # Enable ONLY after E2 known-mass validation. Default OFF.
  # Two-stage attenuation pipeline:
  #   stage 1 = observer LPF @ 0.05 Hz on bias-subtracted output
  #   stage 2 = soft ramp * gain * hard clamp, then routed through PID's
  #             persistent_ff or i_comp_term (i.e. final command is also
  #             capped by limit_sum / limit_i of the host PID).
  # Recommended bring-up: enable=true, force_gain=0.05, torque_gain=0.05, ramp=10s.
  # If hover stays clean for 60 s, raise gain stepwise to 0.2.
  formation_observer_comp:
    enable: true
    force_gain:      0.2   # scalar on F_x/F_y/F_z FF acc [0,1]
    torque_gain:     0.2   # scalar on T_x/T_y/T_z FF ang-acc [0,1]
    ff_force_limit:  5.0   # hard clamp on |FF acc|     [m/s^2]
    ff_torque_limit: 2.0   # hard clamp on |FF ang-acc| [rad/s^2]

  yaw_in_allocation: true  # false: single-channel yaw (spinal-only), true: include yaw in QP
  tgt_angle_lpf_alpha: 0.3

  # Full-vector constrained QP allocation
  # Decision variables: all force components [f_x, f_z] per rotor (not just scalar thrust).
  # Constraints: gimbal angle limits (linearized), component bounds, optional rate limits.
  use_constrained_alloc: true
  alloc_lambda: 1.0e-4          # regularization weight (larger → softer, smaller → tighter tracking)
  alloc_t_max: 21.0             # per-rotor thrust upper bound [N]
  alloc_gimbal_limit_deg: 75.0  # gimbal angle hard limit [deg] (< 90° to avoid singularity)

  pd_wrench_comp_mode: true
  # pd_wrench_comp_mode: false

  external_force_upper_limit: 0.0
  external_force_lower_limit: 0.0
  external_torque_lower_limit: 0.0
  external_torque_lower_limit: 0.0

  cutoff_freq: 1.0
  sample_freq: 40.0

  wrench_comp:
    p_gain: 0.1
    d_gain: 0.07
    i_gain: 0.0
  xy:
    p_gain: 10.0
    i_gain: 0.2
    d_gain: 8.0       # F-6: 5.0→4.0  XY D-term noise is the largest contributor to bt0
    err_d_lpf_cutoff_freq: 3.5  # F-6: NEW  3.5Hz LPF on XY velocity error
    limit_sum: 8.0
    limit_p: 12.0
    limit_i: 5.0
    limit_d: 12.0

  z:
    p_gain: 8.0
    i_gain: 1.5
    d_gain: 4.0       # F-5a: 5.0→4.0  Z D-term dominates bt0 oscillation (100% of pid_body_z variance)
    err_d_lpf_cutoff_freq: 3.0  # F-5b: NEW  3Hz LPF on Z velocity error to reject sensor noise
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 20.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  roll:
    p_gain: 17.0 #8~25
    i_gain: 5.0
    d_gain: 15.0 #4~11
    limit_sum: 0.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0

    start_rp_integration_height: 0.01

  pitch:
    p_gain: 17.0 #8~25
    i_gain: 5.0
    d_gain: 12.0 #4~11
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0

    start_rp_integration_height: 0.01

  yaw:
    p_gain: 15.0
    i_gain: 1.0
    d_gain: 5.0
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 5.0
    limit_d: 20.0

    need_d_control: true

  # Unified-mode PID gains for roll/pitch.
  # Applied when entering unified control mode; restored on exit.
  # P+D are sent to each module's spinal for 1000Hz inner-loop tracking.
  # I-term is retained on PC for slow formation-level bias correction.
  unified_roll:
    p_gain: 8.0
    i_gain: 1.0
    d_gain: 5.0
    limit_sum: 50.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0

  unified_pitch:
    p_gain: 8.0
    i_gain: 3.0
    d_gain: 5.0
    limit_sum: 50.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0

  unified_xy:
    p_gain: 10.0
    i_gain: 0.15
    d_gain: 4.0      # A: 6→4 revert to Flight 3 baseline (ζ=0.632, 验证候选 1: D 噪声放大)
    err_d_lpf_cutoff_freq: 1.5  # A: 3.5→1.5 Hz, 抑制 1-3Hz 速度估计噪声放大成 target_pitch 抖动
    limit_sum: 8.0
    limit_p: 12.0
    limit_i: 5.0
    limit_d: 12.0

  unified_z:
    p_gain: 8.0
    i_gain: 1.5
    d_gain: 4.0
    limit_sum: 25.0
    limit_p: 25.0
    limit_i: 20.0
    limit_d: 25.0

  # Unified-mode yaw PID gains.
  # Full P+I+D on PC side. D-gain also sent to spinal for high-freq damping.
  # When yaw_in_allocation=true, yaw PID output participates in 6-DOF QP allocation.
  unified_yaw:
    p_gain: 15.0
    i_gain: 1.0
    d_gain: 10.0
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 5.0
    limit_d: 20.0
