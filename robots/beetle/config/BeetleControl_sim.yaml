aerial_robot_control_name: aerial_robot_control/beetle_controller

controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : true
  i_term_rp_calc_in_pc: true
  wrench_estimate_update_rate: 100 
  momentum_observer_force_weight: 3
  momentum_observer_torque_weight: 2.5
  wrench_estimate_flag: true
  comp_term_update_freq: 40
  gimbal_dof: 1
  pd_wrench_comp_mode: true
  unified_control_mode: false
  z_i_seed_default: 0.8    # Z I-term seed fallback (used when N not in z_i_seed_by_n)
  pitch_i_seed_default: -0.55  # Pitch I-term seed fallback (err_i domain)

  # P2: Per-module-count seed bucketing.
  # 2-module has worse allocation efficiency → needs larger Z seed and stronger boost.
  z_i_seed_by_n:
    n2: 1.2   # 2-module: higher seed (allocation efficiency ~60-70%)
    n3: 0.8   # 3-module: standard seed (allocation efficiency ~90%+)
  pitch_i_seed_by_n:
    n2: -0.70  # 2-module: larger pitch bias due to geometry
    n3: -0.55  # 3-module: standard pitch bias
  z_ki_boost_frames_default: 60   # boost duration fallback [frames @40Hz]
  z_ki_boost_factor_default: 2.0  # boost factor fallback
  z_ki_boost_by_n:
    n2:
      frames: 90    # 2-module: longer boost (2.25s) to compensate slower convergence
      factor: 3.0   # 2-module: stronger boost for larger efficiency gap
    n3:
      frames: 60    # 3-module: standard boost (1.5s)
      factor: 2.0   # 3-module: standard factor

  # ========== Formation Momentum Observer (Phase U2) ==========
  # Formation-level external wrench estimation using realized wrench from allocation.
  # V1: 3D force only, debug-only output (no control feedback).
  # Observer gain = bandwidth: higher → faster but noisier. Start conservative.
  formation_observer:
    force_observer_gain: 3.0       # K_f: observer gain for force channel [1/s]
    torque_observer_gain: 2.5      # K_t: observer gain for torque channel (V2, unused in V1)
    enable_force_observer: true    # V1: enable 3D force estimation
    enable_torque_observer: true  # V2: enable torque estimation
    bias_settle_time: 3.0          # seconds to wait for observer to converge before calibrating bias
    bias_calib_samples: 40         # number of samples to average for bias (at ~40Hz → ~1s window)

  # ========== Cascade control for unified mode ==========
  # Architecture: PC outer loop (40Hz) does formation-level 6-DOF allocation,
  # sends target_angle + base_thrust to each module's spinal.
  # Spinal inner loop (1000Hz) does P+D attitude tracking per-motor.
  # PC retains I-term only for roll/pitch (formation-level slow bias).
  #
  # These are TORQUE-LEVEL gains sent to spinal via RollPitchYawTerms message.
  # Spinal multiplies them by torque_allocation_matrix_inv to get per-motor gains:
  #   thrust_p_gain[i][axis] = torque_alloc_inv[i][axis] * cascade_*_p
  #   thrust_d_gain[i][axis] = torque_alloc_inv[i][axis] * cascade_*_d
  #
  # Formation inertia is ~600× larger than single beetle (Iyy≈5.98 vs ≈0.01),
  # and the 6×24 pseudoinverse (alloc_inv) has element magnitudes ~10-100× smaller
  # than the trimmed 4×8 single-robot matrix. Together, the effective per-motor
  # attitude gain = alloc_inv × cascade_gain is far too small at cascade_*=8/5.
  #
  # Strategy: increase gradually. Round 1 = 10× (from 8→80, 5→50).
  # Target: roll_pitch_term_[i] should reach ~1/10 of base_thrust_term_[i].
  # If still too weak, increase to 20× or 30× in subsequent rounds.
  # Watch for: high-frequency sawtooth in target_thrust → indicates overshoot.
  # Round2: 3× (from baseline 8/5). Max row inv_rot_X≈0.129, so
  #   thrust_p_max = 0.129 × 25 ≈ 3.2 → errA=0.05 → rp≈0.16N ≈ 1% bt (stable boundary)
  # Round3: 3.5× — tracking err 2.1mrad still has margin, bt0 peak=0.195 < 0.3 safe
  cascade_roll_p: 28.0     # [rad/s²/rad] torque-level P gain for roll  (Round3: 3.5×)
  cascade_roll_d: 18.0     # [rad/s²/(rad/s)] torque-level D gain for roll  (Round3: 3.5×)
  cascade_pitch_p: 28.0    # [rad/s²/rad] torque-level P gain for pitch  (Round3: 3.5×)
  cascade_pitch_d: 18.0    # [rad/s²/(rad/s)] torque-level D gain for pitch  (Round3: 3.5×)
  cascade_yaw_d: 2.5       # [rad/s²/(rad/s)] torque-level D gain for yaw (Round4: 4.0→2.5, reduce yaw damping)
  yaw_alloc_weight: 0.5    # Scale wrench_acc(5) before allocation. 1.0=original, <1=reduce yaw→base_thrust coupling
  tgt_angle_lpf_alpha: 0.3  # LPF for target roll/pitch/yaw sent to spinal (0=no filter, 1=frozen; ~8Hz cutoff @40Hz)

  # Constrained QP allocation (F2) — off by default, pseudo-inverse fallback used when false
  use_constrained_alloc: true
  alloc_lambda: 1.0e-4          # regularization weight
  alloc_t_max: 20.0             # per-rotor thrust upper bound [N]
  alloc_gimbal_limit_deg: 75.0  # gimbal angle hard limit [deg] (< 90° to avoid atan2 singularity at f_z≈0)

  external_force_upper_limit: 0.0
  external_force_lower_limit: 0.0
  external_torque_lower_limit: 0.0
  external_torque_lower_limit: 0.0
  cutoff_freq: 1.0
  sample_freq: 40.0

  wrench_comp:
    p_gain: 0.1
    d_gain: 0.07
    i_gain: 0.00
  xy:
    p_gain: 2.0
    i_gain: 0.2
    d_gain: 2.5       # F-6: 3.0→2.5  D_body_y (std=0.016) is now the largest D-term
                       # across all axes. 17% gain cut + stronger LPF to reduce bt0/tgtA.
    err_d_lpf_cutoff_freq: 3.5  # F-6: 6→3.5Hz  Same strategy as Z (F-5).
                                # Slightly higher than Z's 3Hz since XY needs faster response.
    limit_sum: 8.0  # each module share ≈ F_total/3/mass ≈ 2.2 m/s², PID ~2-3 → ~5 total
    limit_p: 12.0
    limit_i: 8.0  # match limit_sum to prevent integral windup
    limit_d: 12.0

  z:
    p_gain: 5.0
    i_gain: 1.0
    d_gain: 2.0       # F-5a: 2.5→2.0  Z D-term accounts for 100% of pid_body_z variance
                       # (std=0.014, pk-pk=0.072), which dominates bt0 oscillation.
                       # 20% gain reduction + stronger LPF aims to cut D_body_z std by ~44%.
    err_d_lpf_cutoff_freq: 3.0  # F-5b: 6→3Hz  More aggressive filtering on Z velocity error.
                                # 3Hz still passes real altitude disturbances (< ~1Hz)
                                # but rejects 5-10Hz sensor noise that was leaking through.
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 20.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  roll:
    p_gain: 8.0 #8~25
    i_gain: 1.0
    d_gain: 5.0 #4~11
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0
    start_rp_integration_height: 0.01

  pitch:
    p_gain: 8.0 #8~25
    i_gain: 1.0
    d_gain: 5.0 #4~11
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0

    start_rp_integration_height: 0.01

  yaw:
    p_gain: 5.0
    i_gain: 1.0
    d_gain: 4.0
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0

    need_d_control: true

  # ========== Unified mode PID overrides ==========
  # Applied ONLY when entering unified control mode; restored on exit.
  # Roll/Pitch: only i_gain is used on PC (P+D handled by spinal cascade).
  unified_roll:
    i_gain: 1.0
    limit_sum: 50.0
    limit_i: 10.0

  unified_pitch:
    i_gain: 5.0
    limit_sum: 50.0
    limit_i: 10.0

  unified_xy:
    p_gain: 2.0
    i_gain: 0.2
    d_gain: 2.5
    limit_sum: 8.0
    limit_p: 12.0
    limit_i: 8.0
    limit_d: 12.0

  unified_z:
    p_gain: 5.0
    i_gain: 1.0
    d_gain: 2.0
    limit_sum: 25.0
    limit_p: 25.0
    limit_i: 20.0
    limit_d: 25.0
