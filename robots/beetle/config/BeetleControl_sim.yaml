aerial_robot_control_name: aerial_robot_control/beetle_controller

controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : true
  i_term_rp_calc_in_pc: true
  wrench_estimate_update_rate: 100 
  momentum_observer_force_weight: 3
  momentum_observer_torque_weight: 2.5
  wrench_estimate_flag: true
  comp_term_update_freq: 40
  gimbal_dof: 1
  pd_wrench_comp_mode: true
  unified_control_mode: false
  z_i_seed_default: 0.8    # Z I-term seed for unified mode switch (Plan E')
  pitch_i_seed_default: -0.55  # Pitch I-term seed in err_i domain (SS i_term≈-2.7, Ki=5 → err_i≈-0.54)

  # ========== Cascade control for unified mode ==========
  # Architecture: PC outer loop (40Hz) does formation-level 6-DOF allocation,
  # sends target_angle + base_thrust to each module's spinal.
  # Spinal inner loop (1000Hz) does P+D attitude tracking per-motor.
  # PC retains I-term only for roll/pitch (formation-level slow bias).
  #
  # These are TORQUE-LEVEL gains sent to spinal via RollPitchYawTerms message.
  # Spinal multiplies them by torque_allocation_matrix_inv to get per-motor gains:
  #   thrust_p_gain[i][axis] = torque_alloc_inv[i][axis] * cascade_*_p
  #   thrust_d_gain[i][axis] = torque_alloc_inv[i][axis] * cascade_*_d
  #
  # Start conservative: these act as "local stabilizers", not "second main controller".
  # Independent mode single-beetle gains: P=8, D=5 (from roll/pitch section below).
  # Formation mode needs higher gains due to larger inertia (Iyy≈5.98 vs single≈0.01).
  # But spinal P+D only handles LOCAL attitude tracking; the heavy lifting
  # (formation allocation, position control) is done by PC.
  cascade_roll_p: 8.0      # [rad/s²/rad] torque-level P gain for roll
  cascade_roll_d: 5.0      # [rad/s²/(rad/s)] torque-level D gain for roll
  cascade_pitch_p: 8.0     # [rad/s²/rad] torque-level P gain for pitch
  cascade_pitch_d: 5.0     # [rad/s²/(rad/s)] torque-level D gain for pitch
  cascade_yaw_d: 4.0       # [rad/s²/(rad/s)] torque-level D gain for yaw

  external_force_upper_limit: 0.0
  external_force_lower_limit: 0.0
  external_torque_lower_limit: 0.0
  external_torque_lower_limit: 0.0
  cutoff_freq: 1.0
  sample_freq: 40.0

  wrench_comp:
    p_gain: 0.1
    d_gain: 0.07
    i_gain: 0.00
  xy:
    p_gain: 2.0
    i_gain: 0.2
    d_gain: 4.0
    limit_sum: 8.0  # each module share ≈ F_total/3/mass ≈ 2.2 m/s², PID ~2-3 → ~5 total
    limit_p: 12.0
    limit_i: 8.0  # match limit_sum to prevent integral windup
    limit_d: 12.0

  z:
    p_gain: 5.0
    i_gain: 1.0
    d_gain: 2.5
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 20.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  roll:
    p_gain: 8.0 #8~25
    i_gain: 1.0
    d_gain: 5.0 #4~11
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0
    start_rp_integration_height: 0.01

  pitch:
    p_gain: 8.0 #8~25
    i_gain: 1.0
    d_gain: 5.0 #4~11
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0

    start_rp_integration_height: 0.01

  yaw:
    p_gain: 5.0
    i_gain: 1.0
    d_gain: 4.0
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0

    need_d_control: true

  # ========== Unified mode PID overrides ==========
  # In unified (formation) mode, the formation has a large CoG offset (~0.522 m)
  # creating an inverted pendulum effect. The gravity instability threshold is
  # ω² = m·g·d / I_yy ≈ 23.2 rad/s²/rad, so P gain must exceed this.
  # These gains are applied ONLY when entering unified control mode.
  # When exiting unified mode, the original (per-module) gains are restored.
  unified_roll:
    p_gain: 36.0
    i_gain: 1.0
    d_gain: 25.0
    limit_sum: 50.0
    limit_p: 50.0
    limit_i: 10.0
    limit_d: 50.0

  unified_pitch:
    p_gain: 36.0
    i_gain: 5.0
    d_gain: 25.0
    limit_sum: 50.0
    limit_p: 50.0
    limit_i: 10.0
    limit_d: 50.0
