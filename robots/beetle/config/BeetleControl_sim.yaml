aerial_robot_control_name: aerial_robot_control/beetle_controller

controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : true
  i_term_rp_calc_in_pc: true
  wrench_estimate_update_rate: 100 
  momentum_observer_force_weight: 3
  momentum_observer_torque_weight: 2.5
  wrench_estimate_flag: true
  comp_term_update_freq: 40
  gimbal_dof: 1
  pd_wrench_comp_mode: true
  unified_control_mode: false
  unified_reference_warmup_frames: 20  # leader-side local warmup after mode switch [frames @40Hz]
  unified_reference_timeout: 0.8       # follower force-lands if leader reference is stale in flight [s]
  unified_peer_stall_guard: true       # leader force-lands if an assembled peer heartbeat is stale
  unified_peer_heartbeat_timeout: 0.8
  unified_external_wrench_feedback: true
  unified_external_wrench_feedback_gain: 0.2
  unified_external_wrench_feedback_task_weight: 0.05  # LF-style soft task-space disturbance rejection
  unified_external_wrench_feedback_settle_pos: 0.08   # [m/rad], learn observer bias only near hover equilibrium
  unified_external_wrench_feedback_settle_vel: 0.12   # [m/s, rad/s], learn observer bias only when slow

  # v4: seed_bucket / z_ki_boost machinery removed — bumpless transfer (de-gravity)
  # handles LF↔unified switching directly in initUnifiedMode().

  # ========== Formation Momentum Observer ==========
  # Formation-level external wrench estimation using realized wrench from allocation.
  # Feedback is bias-corrected, hover-settled, and injected only as a low-weight
  # task-space disturbance-rejection objective.
  # Observer gain = bandwidth: higher → faster but noisier. Start conservative.
  formation_observer:
    force_observer_gain: 3.0       # K_f: observer gain for force channel [1/s]
    torque_observer_gain: 2.5      # K_t: observer gain for torque channel
    enable_force_observer: true    # V1: enable 3D force estimation
    enable_torque_observer: true   # V2: enable torque estimation
    est_force_lpf_cutoff_freq: 0.5
    est_torque_lpf_cutoff_freq: 0.5
    ff_ramp_seconds: 1.0           # short LF-like gate ramp without a hard step

  yaw_alloc_weight: 0.5    # Scale wrench_acc(5) before allocation. 1.0=original, <1=reduce yaw→base_thrust coupling

  # Unified internal wrench management. In sim we enable a small secondary gain
  # for validation; control uses bias-corrected residuals only after hover bias
  # initialization is ready.
  unified_internal_wrench_diag: true
  unified_internal_wrench_log: true
  unified_internal_wrench_detail_log: false
  unified_internal_wrench_log_period: 5.0
  unified_internal_wrench_secondary_gain: 0.0

  # Leader-only compact log for aerial towing validation. Prints only while a
  # nonzero formation_desired_wrench is active.
  unified_towing_debug_log: true
  unified_towing_debug_log_period: 1.0
  # Spinal owns roll/pitch P+D. The formation QP receives only the slow PC
  # I-term in its control target; task wrench is tracked by a separate soft objective.

  # Constrained QP allocation (F2) — off by default, pseudo-inverse fallback used when false
  use_constrained_alloc: true
  alloc_lambda: 1.0e-2          # secondary objective weight toward balanced hover allocation
  alloc_t_max: 21.0             # per-rotor thrust upper bound [N]
  alloc_gimbal_limit_deg: 75.0  # gimbal angle hard limit [deg] (< 90° to avoid atan2 singularity at f_z≈0)
  # Spidar-style secondary costs: keep the allocation close to balanced hover
  # and penalize total thrust before using actuator margin.
  alloc_rate_weight: 2.0e-2     # soft penalty on |f[k] - f[k-1]|
  alloc_rate_limit: 0.0         # hard per-cycle component delta limit [N]; 0 disables
  alloc_direction_rate_limit_deg: 0.0  # hard per-cycle gimbal direction band [deg]; soft fx-rate is preferred
  alloc_lateral_rate_weight: 5.0e-2    # soft penalty on 1-DOF rotor fx[k]-fx[k-1]
  # Weighted control/stabilization residual [Fx,Fy,Fz,Tx,Ty,Tz].
  alloc_wrench_weights: [0.50, 0.50, 1.20, 0.25, 0.40, 0.50]
  # Fallback weighted task residual [Fx,Fy,Fz,Tx,Ty,Tz]. Demo layers may publish
  # task-specific weights with each wrench command.
  alloc_task_wrench_weights: [1.00, 1.00, 0.40, 0.40, 0.40, 0.40]
  alloc_effort_weight: 3.0e-3   # secondary min-energy cost on sum_i ||f_i||^2
  alloc_module_weights: []      # module-id indexed multiplier for alloc_lambda; lower => easier to deviate/output more
  alloc_interface_force_weight: 1.0e-3   # soft tracking of actuator-side cut force proxy [1/N^2]
  alloc_interface_torque_weight: 1.0e-2  # soft tracking of actuator-side cut torque proxy [1/(Nm)^2]
  alloc_interface_force_limit: 0.0    # component-wise cut force proxy bound [N]; 0 disables
  alloc_interface_torque_limit: 0.0   # component-wise cut torque proxy bound [Nm]; 0 disables
  alloc_priority_enabled: false
  # Spidar-style task tracking: axes with nonzero desired wrench and task weight
  # >= min_weight are narrow hard bands; effort/rate/balance stay secondary.
  alloc_task_priority_enabled: true
  alloc_task_priority_min_weight: 0.5
  # Hard 6D wrench tracking bands [Fx,Fy,Fz,Tx,Ty,Tz] in acceleration space.
  # Reused by task-priority rows; <=0 disables that row.
  alloc_priority_wrench_tolerances: [0.35, 0.35, 0.30, 0.40, 0.35, 0.40]

  desired_wrench_timeout: 0.5
  external_force_upper_limit: 0.0
  external_force_lower_limit: 0.0
  external_torque_upper_limit: 0.0
  external_torque_lower_limit: 0.0
  cutoff_freq: 1.0
  sample_freq: 40.0

  wrench_comp:
    p_gain: 0.1
    d_gain: 0.07
    i_gain: 0.00
  xy:
    p_gain: 2.0
    i_gain: 0.2
    d_gain: 2.5       # F-6: 3.0→2.5  D_body_y (std=0.016) is now the largest D-term
                       # across all axes. 17% gain cut + stronger LPF to reduce bt0/tgtA.
    err_d_lpf_cutoff_freq: 3.5  # F-6: 6→3.5Hz  Same strategy as Z (F-5).
                                # Slightly higher than Z's 3Hz since XY needs faster response.
    limit_sum: 8.0  # each module share ≈ F_total/3/mass ≈ 2.2 m/s², PID ~2-3 → ~5 total
    limit_p: 12.0
    limit_i: 8.0  # match limit_sum to prevent integral windup
    limit_d: 12.0

  z:
    p_gain: 5.0
    i_gain: 1.0
    d_gain: 2.0       # F-5a: 2.5→2.0  Z D-term accounts for 100% of pid_body_z variance
                       # (std=0.014, pk-pk=0.072), which dominates bt0 oscillation.
                       # 20% gain reduction + stronger LPF aims to cut D_body_z std by ~44%.
    err_d_lpf_cutoff_freq: 3.0  # F-5b: 6→3Hz  More aggressive filtering on Z velocity error.
                                # 3Hz still passes real altitude disturbances (< ~1Hz)
                                # but rejects 5-10Hz sensor noise that was leaking through.
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 20.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  roll:
    p_gain: 8.0 #8~25
    i_gain: 1.0
    d_gain: 5.0 #4~11
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0
    start_rp_integration_height: 0.01

  pitch:
    p_gain: 8.0 #8~25
    i_gain: 1.0
    d_gain: 5.0 #4~11
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0

    start_rp_integration_height: 0.01

  yaw:
    p_gain: 5.0
    i_gain: 1.0
    d_gain: 4.0
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0

    need_d_control: true

  # ========== Unified mode PID overrides ==========
  # Applied when entering unified control mode; restored on exit.
  # P+D are sent to each module's spinal for 1000Hz inner-loop tracking.
  # I-term is retained on PC for slow formation-level bias correction.
  unified_roll:
    p_gain: 28.0
    i_gain: 1.0
    d_gain: 18.0
    limit_sum: 50.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0

  unified_pitch:
    p_gain: 28.0
    i_gain: 5.0
    d_gain: 18.0
    limit_sum: 50.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0

  unified_xy:
    p_gain: 2.0
    i_gain: 0.2
    d_gain: 2.5
    limit_sum: 8.0
    limit_p: 12.0
    limit_i: 8.0
    limit_d: 12.0

  unified_z:
    p_gain: 5.0
    i_gain: 1.0
    d_gain: 2.0
    limit_sum: 25.0
    limit_p: 25.0
    limit_i: 20.0
    limit_d: 25.0

  unified_yaw:
    p_gain: 5.0
    i_gain: 1.0
    d_gain: 4.0
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0
