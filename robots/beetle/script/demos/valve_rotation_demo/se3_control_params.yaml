# SE(3)控制参数配置文件
# Dragon Manipulate模式适配Beetle倾转四旋翼

# =============================================================================
# Dragon Manipulate模式参数 (主要的阀门转动阶段)
# =============================================================================
manipulate:
  target_angular_velocity: 0.6    # 目标角速度 (rad/s) - 适中的转动速度
  control_rate: 15.0              # 控制频率 (Hz) - 平衡性能和稳定性
  torque_limit: 3.0               # 最大扭矩限制 (N·m) - 保护阀门
  init_torque: 0.1                # 初始扭矩 (N·m) - 柔和启动
  max_manipulation_time: 45.0     # 最大操作时间 (s)
  min_manipulation_time: 5.0      # 最小操作时间 (s) - 确保充分转动
  valve_stuck_threshold: 3.0      # 阀门卡住检测时间 (s)
  force_adaptation_rate: 0.1      # 力自适应速率

# =============================================================================
# Contact模式参数 (接触检测阶段)  
# =============================================================================
contact:
  target_angular_velocity: 0.3    # 接触阶段角速度 (rad/s) - 较低以免过早转动
  control_rate: 10.0              # 控制频率 (Hz)
  contact_duration: 8.0           # 最大接触检测时间 (s)
  min_contact_time: 2.0           # 最小接触时间 (s)
  valve_rotation_threshold: 1.5   # 阀门转动检测阈值 (degrees)
  contact_force_threshold: 0.3    # 接触力检测阈值 (N)

# =============================================================================
# Finish模式参数 (有序脱离阶段)
# =============================================================================  
finish:
  relax_duration: 2.0             # 松弛阶段持续时间 (s)
  vertical_offset: 0.05           # 垂直抬高距离 (m) - 5cm拔出爪子
  withdrawal_distance: 0.15       # 水平脱离距离 (m) - 15cm径向脱离
  safe_distance_threshold: 0.08   # 安全脱离距离阈值 (m)

# =============================================================================
# 收敛阈值参数
# =============================================================================
convergence:
  pos_thresh: 0.02                # 位置收敛阈值 (m) - 2cm精度
  rot_thresh: 0.0524              # 旋转收敛阈值 (rad) - 3度精度
  force_threshold: 0.3            # 力检测阈值 (N)
  vel_thresh: 0.1                 # 速度阈值 (m/s) - 兼容参数

# =============================================================================
# 在线轨迹生成器参数
# =============================================================================
trajectory:
  radius_adaptation_rate: 0.1     # 半径自适应速率
  velocity_threshold_for_lock: 0.8 # 半径锁定的速度阈值 (80%目标速度)
  uav_mass: 1.5                   # UAV质量 (kg) - 用于向心力计算
  min_radius_factor: 0.8          # 最小半径因子 (相对初始半径)
  max_radius_factor: 1.2          # 最大半径因子 (相对初始半径)

# =============================================================================
# 插入优化器参数
# =============================================================================
insertion:
  valve_radius: 0.10              # 阀门内径半径 (m)
  valve_beam_width: 0.035         # 阀门辐条宽度 (m)
  safety_margin: 0.002            # 安全裕度 (m)
  pre_insertion_distance: 0.035   # 预插入距离 (m)
  circumferential_offset: 0.005   # 周向偏移 (m)

# =============================================================================
# 调试和日志参数
# =============================================================================
debug:
  enable_debug_view: true         # 启用调试视图
  log_throttle_rate: 2.0          # 日志节流频率 (s)
  trajectory_debug: true          # 轨迹调试输出
  force_debug: true               # 力控制调试输出
  convergence_debug: true         # 收敛检查调试输出

# =============================================================================
# 安全限制参数
# =============================================================================
safety:
  max_position_error: 0.1         # 最大位置误差 (m)
  max_velocity: 0.5               # 最大速度限制 (m/s)
  max_angular_velocity: 1.0       # 最大角速度限制 (rad/s)
  emergency_stop_force: 10.0      # 紧急停止力阈值 (N)
  workspace_limit_x: [-2.0, 2.0]  # X轴工作空间限制 (m)
  workspace_limit_y: [-2.0, 2.0]  # Y轴工作空间限制 (m)
  workspace_limit_z: [0.0, 3.0]   # Z轴工作空间限制 (m)

# =============================================================================
# 仿真特定参数
# =============================================================================
simulation:
  simulation_mode: true           # 是否为仿真模式
  physics_step_size: 0.001        # 物理仿真步长 (s)
  real_time_factor: 1.0           # 实时因子
  noise_level: 0.001              # 传感器噪声水平

# =============================================================================
# Dragon兼容性参数 (用于算法移植验证)
# =============================================================================
dragon_compatibility:
  use_dragon_algorithms: true     # 使用Dragon算法
  enable_joint_space_control: false # Beetle没有多关节，禁用
  enable_cartesian_space_control: true # 启用笛卡尔空间控制
  force_torque_feedforward: true  # 启用力/扭矩前馈