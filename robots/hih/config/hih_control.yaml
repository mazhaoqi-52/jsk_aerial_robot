# Hand in Hand: role-specific overrides, read BEFORE inherited PID/MOB initialization.
# PID/MOB values below are copied from the working HihControl.yaml, not retuned.
# Admittance vectors use [world X, world Y, world Z, world yaw]. SI units: m/rad.
# Virtual masses: kg/kg*m^2; damping: N*s/m or Nm*s/rad; stiffness: N/m or Nm/rad.
# normal_contact points from the robot toward the payload in the MODEL contact_point axes.
# 10 N and virtual dynamics are simulation-derived starting values, NOT validated flight gains.
# Limits are deliberately smaller than the simulation; enabled=false by default.
# K=0 permits steady nonzero contact force without spring pullback toward the old task pose.
# No automatic approach or lifting sequence is implemented here.
# Configure before bringup; restart the role controller to reload these settings.
leader:
  controller:
    wrench_estimate_flag: true
    wrench_estimate_update_rate: 100
    momentum_observer_force_weight: 3
    momentum_observer_torque_weight: 2.5
    xy:
      p_gain: 10.0
      i_gain: 0.2
      d_gain: 5.0
      err_d_lpf_cutoff_freq: 0.0
      limit_sum: 8.0
      limit_p: 12.0
      limit_i: 5.0
      limit_d: 12.0
    z:
      p_gain: 8.0
      i_gain: 1.5
      d_gain: 4.0
      err_d_lpf_cutoff_freq: 3.0
      limit_err_p: 1.0
      limit_sum: 25.0
      limit_p: 25.0
      limit_i: 20.0
      limit_d: 25.0
      force_landing_descending_rate: -0.5
    roll:
      p_gain: 17.0
      i_gain: 5.0
      d_gain: 15.0
      limit_sum: 0.0
      limit_p: 20.0
      limit_i: 10.0
      limit_d: 20.0
      start_rp_integration_height: 0.01
    pitch:
      p_gain: 17.0
      i_gain: 5.0
      d_gain: 12.0
      limit_sum: 20.0
      limit_p: 20.0
      limit_i: 10.0
      limit_d: 20.0
      start_rp_integration_height: 0.01
    yaw:
      p_gain: 15.0
      i_gain: 1.0
      d_gain: 5.0
      limit_err_p: 0.4
      limit_sum: 20.0
      limit_p: 20.0
      limit_i: 5.0
      limit_d: 20.0
      need_d_control: true
follower:
  controller:
    wrench_estimate_flag: true
    wrench_estimate_update_rate: 100
    momentum_observer_force_weight: 3
    momentum_observer_torque_weight: 2.5
    xy:
      p_gain: 10.0
      i_gain: 0.2
      d_gain: 5.0
      err_d_lpf_cutoff_freq: 0.0
      limit_sum: 8.0
      limit_p: 12.0
      limit_i: 5.0
      limit_d: 12.0
    z:
      p_gain: 8.0
      i_gain: 1.5
      d_gain: 4.0
      err_d_lpf_cutoff_freq: 3.0
      limit_err_p: 1.0
      limit_sum: 25.0
      limit_p: 25.0
      limit_i: 20.0
      limit_d: 25.0
      force_landing_descending_rate: -0.5
    roll:
      p_gain: 17.0
      i_gain: 5.0
      d_gain: 15.0
      limit_sum: 0.0
      limit_p: 20.0
      limit_i: 10.0
      limit_d: 20.0
      start_rp_integration_height: 0.01
    pitch:
      p_gain: 17.0
      i_gain: 5.0
      d_gain: 12.0
      limit_sum: 20.0
      limit_p: 20.0
      limit_i: 10.0
      limit_d: 20.0
      start_rp_integration_height: 0.01
    yaw:
      p_gain: 15.0
      i_gain: 1.0
      d_gain: 5.0
      limit_err_p: 0.4
      limit_sum: 20.0
      limit_p: 20.0
      limit_i: 5.0
      limit_d: 20.0
      need_d_control: true
    admittance:
      enabled: false
      apply_velocity: true
      world_frame: world
      sample_timeout: 0.15
      debug_period: 0.05
      max_dt: 0.1
      normal_contact:
      - 1.0
      - 0.0
      - 0.0
      normal_force_desired: 10.0
      normal_force_max: 20.0
      normal_force_rate: 1.0
      contact_threshold: 0.8
      mass:
      - 1.2
      - 1.6
      - 3.2
      - 0.2
      damping:
      - 20.0
      - 20.0
      - 30.0
      - 1.0
      stiffness:
      - 0.0
      - 0.0
      - 0.0
      - 0.0
      max_offset:
      - 0.15
      - 0.15
      - 0.1
      - 0.15
      max_velocity:
      - 0.1
      - 0.1
      - 0.08
      - 0.15
      max_acceleration:
      - 0.3
      - 0.3
      - 0.2
      - 0.4
      max_wrench:
      - 2.0
      - 2.0
      - 2.0
      - 0.5
      deadband:
      - 0.05
      - 0.05
      - 0.05
      - 0.01
      bias:
      - 0.0
      - 0.0
      - 0.0
      - 0.0
      gain:
      - 1.0
      - 1.0
      - 1.0
      - 1.0
      filter_cutoff_hz: 10.0

    # Supplementary CoP trim AFTER Admittance, BEFORE inherited PID.
    # Requires Admittance to be applying; CoP is still estimated while OFF.
    # All parameters load at bringup. Only the three enabled flags also support
    # runtime changes at /hih2/controller/cop_adjustment/... (not the role copy).
    cop_adjustment:
      enabled: false
      safe_y: 0.05                   # [m] CoP safety half-width, user-selected
      safe_z: 0.05                   # [m] -> safe area is +/-0.05 in each axis
      hysteresis_y: 0.005            # [m] boundary latch release margin
      hysteresis_z: 0.005
      min_normal_force: 1.0          # [N] compressive Fn=-Fx_C; reject before division
      max_abs_cop_y: 0.25            # [m] numerical outlier limit, NOT plate size
      max_abs_cop_z: 0.25
      filter_cutoff_hz: 5.0          # CoP LPF; 0 bypasses filtering
      sample_timeout: 0.15           # [s] use original IMU/MOB sample stamp
      max_dt: 0.1                    # [s] hold across invalid control intervals
      debug_period: 0.05             # [s]
      force_bias_contact: [0.0, 0.0, 0.0]   # [N], subtracted only in CoP estimator
      torque_bias_contact: [0.0, 0.0, 0.0]  # [Nm], about contact center, contact axes
      yaw:                          # contact CoP-Y -> Euler/world-Z yaw offset
        enabled: true
        gain: 0.17453292519943295 # [rad/(m*s)] = 10 deg/(m*s)
        direction: 1.0              # +1 or -1; inherited simulation sign
        max_offset: 0.05235987755982989 # [rad] = 3 deg
        max_rate: 0.008726646259971648 # [rad/s] = 0.5 deg/s
      z:                            # contact CoP-Z -> WORLD Z position offset
        enabled: true
        gain: 0.2                   # [1/s], weak supplementary trim
        direction: 1.0
        max_offset: 0.02            # [m] = 20 mm
        max_rate: 0.005             # [m/s] = 5 mm/s
