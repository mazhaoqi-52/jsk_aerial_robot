# hih_key.py loads this file automatically. All speeds are positive SI values.
# Frame: world = global X/Y directions, local = each robot's current yaw axes.
frame: world
publish_rate: 20.0
# Terminals report key characters, not key-up events. Last key repeat expires here.
key_timeout: 0.35
command_repeat_gap: 0.7
stop_repeats: 3
common_targets: [leader, follower]
approach_speed: 0.02    # m/s, g toggles BOTH robots' LOCAL +X motion

robots:
  leader:
    namespace: /hih1
    xy_speed: 0.10       # m/s
    z_speed: 0.10        # m/s
    yaw_speed: 0.10      # rad/s
  follower:
    namespace: /hih2
    xy_speed: 0.10
    z_speed: 0.10
    yaw_speed: 0.10

keys:
  common:
    arm: v
    takeoff: b
    land: n
    force_landing: m
    halt: '/'
    stop_motion: SPACE  # zero keyboard velocity; does NOT stop motors
    approach: g
  follower:
    '+X': w
    '-X': s
    '+Y': a
    '-Y': d
    '+Z': r
    '-Z': f
    '+yaw': q
    '-yaw': e
  leader:
    '+X': i
    '-X': k
    '+Y': j
    '-Y': l
    '+Z': p
    '-Z': ';'
    '+yaw': u
    '-yaw': o

# Leader-only, WORLD frame, one execution per trigger (no automatic repetition).
# period is the total time for all four segments; each segment takes period/4.
# displacement is the distance of EACH translation segment, not the whole path.
trajectories:
  "1":  # +X -> +Z -> -X -> -Z (returns the nominal reference to its start)
    period: 20.0                 # s, total four-segment duration
    displacement: 0.20           # m per translation segment
  "2":  # +yaw -> -Y -> -yaw -> -X (ends at -displacement in both X and Y)
    period: 20.0
    displacement: 0.20           # m per translation segment
    yaw_displacement_deg: 90.0   # degrees per yaw segment; net yaw change is zero
